name: Build and Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Android CMake
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "cmake;3.22.1"

      - name: Determine Version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" =~ ^refs/tags/v(.*)$ ]]; then
            VERSION_NAME="${BASH_REMATCH[1]}"
          else
            PUB_VER=$(grep '^version:' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1)
            VERSION_NAME="${PUB_VER}"
          fi
          BUILD_NUMBER="${{ github.run_number }}"
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "build_number=${BUILD_NUMBER}" >> $GITHUB_OUTPUT
          echo "full_version=v${VERSION_NAME}+${BUILD_NUMBER}" >> $GITHUB_OUTPUT
          echo "Building version: ${VERSION_NAME}+${BUILD_NUMBER}"

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Auto-detect IP & Configure Gradle Mirror
        shell: bash
        run: |
          chmod +x ./scripts/auto_detect_gradle_mirror.sh
          ./scripts/auto_detect_gradle_mirror.sh

      - name: Build Android Release APK
        run: |
          flutter build apk --release \
            --build-name=${{ steps.version.outputs.version_name }} \
            --build-number=${{ steps.version.outputs.build_number }}

      - name: Rename APK Output
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/FlFund-${{ steps.version.outputs.full_version }}-android.apk"

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fl-fund-android-apk
          path: build/app/outputs/flutter-apk/FlFund-${{ steps.version.outputs.full_version }}-android.apk

  build-windows:
    name: Build Windows App & Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Determine Version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" =~ ^refs/tags/v(.*)$ ]]; then
            VERSION_NAME="${BASH_REMATCH[1]}"
          else
            PUB_VER=$(grep '^version:' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1)
            VERSION_NAME="${PUB_VER}"
          fi
          BUILD_NUMBER="${{ github.run_number }}"
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "build_number=${BUILD_NUMBER}" >> $GITHUB_OUTPUT
          echo "full_version=v${VERSION_NAME}+${BUILD_NUMBER}" >> $GITHUB_OUTPUT
          echo "Building version: ${VERSION_NAME}+${BUILD_NUMBER}"

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Build Windows Release
        shell: bash
        run: |
          flutter build windows --release \
            --build-name=${{ steps.version.outputs.version_name }} \
            --build-number=${{ steps.version.outputs.build_number }}

      - name: Compress Portable Windows Release Zip
        shell: pwsh
        run: |
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "FlFund-${{ steps.version.outputs.full_version }}-windows-portable.zip"

      - name: Download ChineseSimplified Language File
        shell: pwsh
        run: |
          $innoLangPath = "${env:ProgramFiles(x86)}\Inno Setup 6\Languages"
          if (-not (Test-Path "$innoLangPath\ChineseSimplified.isl")) {
            Invoke-WebRequest -Uri "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/ChineseSimplified.isl" -OutFile "$innoLangPath\ChineseSimplified.isl"
          }

      - name: Build Windows Installer (Inno Setup)
        shell: pwsh
        run: |
          iscc /DAppVersion="${{ steps.version.outputs.version_name }}" windows/installer.iss
          Move-Item -Path "build/windows/installer/FlFund-Setup.exe" -Destination "FlFund-${{ steps.version.outputs.full_version }}-windows-setup.exe"

      - name: Upload Windows Portable Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fl-fund-windows-portable-zip
          path: FlFund-${{ steps.version.outputs.full_version }}-windows-portable.zip

      - name: Upload Windows Setup Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fl-fund-windows-setup-installer
          path: FlFund-${{ steps.version.outputs.full_version }}-windows-setup.exe

  create-release:
    name: Create GitHub Release
    needs: [build-android, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: fl-fund-android-apk
          path: ./artifacts/android

      - name: Download Windows Portable Zip Artifact
        uses: actions/download-artifact@v4
        with:
          name: fl-fund-windows-portable-zip
          path: ./artifacts/windows

      - name: Download Windows Setup Installer Artifact
        uses: actions/download-artifact@v4
        with:
          name: fl-fund-windows-setup-installer
          path: ./artifacts/windows

      - name: Extract Release Notes from CHANGELOG
        id: changelog
        shell: bash
        run: |
          # 从 tag（如 v1.8.0）解析出版本号 1.8.0
          VERSION="${GITHUB_REF_NAME#v}"
          # 提取 CHANGELOG.md 中 "## <版本号>" 到下一个 "## " 之间的内容
          if [ -f CHANGELOG.md ]; then
            awk -v ver="$VERSION" '
              $0 ~ "^## "ver"([^0-9.]|$)" { found=1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md > release_notes.md
          fi
          # 若未找到对应版本章节，写入提示占位内容
          if [ ! -s release_notes.md ]; then
            echo "本版本暂无更新说明，详见下方自动生成的变更记录。" > release_notes.md
          fi
          echo "--- Release Notes ---"
          cat release_notes.md

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./artifacts/android/*.apk
            ./artifacts/windows/*.zip
            ./artifacts/windows/*.exe
          body_path: release_notes.md
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
