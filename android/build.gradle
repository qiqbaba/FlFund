ext {
    flutter = [
        compileSdkVersion: 34,
        minSdkVersion: 21,
        targetSdkVersion: 34,
        ndkVersion: "23.1.7779620"
    ]
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

subprojects {
    ext.kotlin_version = '2.2.0'
    buildscript {
        repositories {
            google()
            mavenCentral()
        }
        configurations.all {
            resolutionStrategy.eachDependency { details ->
                if (details.requested.group == 'org.jetbrains.kotlin') {
                    details.useVersion '2.2.0'
                }
            }
        }
    }

    def configureProject = { proj ->
        if (proj.name == "app") {
            return
        }
        if (proj.extensions.findByName("android") != null) {
            proj.android {
                if (compileSdkVersion != null) {
                    if (compileSdkVersion == 'android-35' || compileSdkVersion == 35) {
                        compileSdkVersion 34
                    }
                }
                try {
                    if (compileSdk == 35) {
                        compileSdk = 34
                    }
                } catch (Exception e) {}
            }
        }
        
        if (proj.extensions.findByName("android") != null) {
            try {
                proj.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile) {
                    kotlinOptions {
                        def targetCompat = proj.android.compileOptions.targetCompatibility
                        if (targetCompat != null) {
                            def vs = targetCompat.toString()
                            if (vs == "1.8" || vs == "VERSION_1_8") {
                                jvmTarget = "1.8"
                            } else if (vs == "17" || vs == "VERSION_17") {
                                jvmTarget = "17"
                            } else if (vs == "11" || vs == "VERSION_11") {
                                jvmTarget = "11"
                            } else {
                                jvmTarget = vs
                            }
                        }
                    }
                }
            } catch (Exception e) {}
        }
    }
    if (project.state.executed) {
        configureProject(project)
    } else {
        project.afterEvaluate { configureProject(it) }
    }
}
