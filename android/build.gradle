ext {
    flutter = [
        compileSdkVersion: 36,
        minSdkVersion: 21,
        targetSdkVersion: 36,
        ndkVersion: "28.2.13676358"
    ]
}

allprojects {
    repositories {
        maven { url 'https://mirrors.tencent.com/nexus/repository/maven-public/' }
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

subprojects {
    ext.kotlin_version = '2.2.20'
    buildscript {
        repositories {
            maven { url 'https://mirrors.tencent.com/nexus/repository/maven-public/' }
            maven { url 'https://maven.aliyun.com/repository/google' }
            maven { url 'https://maven.aliyun.com/repository/public' }
            google()
            mavenCentral()
        }
        configurations.all {
            resolutionStrategy.eachDependency { details ->
                if (details.requested.group == 'org.jetbrains.kotlin') {
                    details.useVersion '2.2.20'
                }
            }
        }
    }

    def configureProject = { proj ->
        if (proj.extensions.findByName("android") != null) {
            try {
                proj.android.ndkVersion = "28.2.13676358"
            } catch (Exception e) {}
        }
        if (proj.name == "app") {
            return
        }
        if (proj.extensions.findByName("android") != null) {
            try {
                proj.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile) {
                    kotlinOptions {
                        def targetCompat = proj.android.compileOptions.targetCompatibility
                        if (targetCompat != null) {
                            def vs = targetCompat.toString()
                            if (vs == "1.8" || vs == "VERSION_1_8") {
                                jvmTarget = "1.8"
                            } else if (vs == "17" || vs == "VERSION_17") {
                                jvmTarget = "17"
                            } else if (vs == "11" || vs == "VERSION_11") {
                                jvmTarget = "11"
                            } else {
                                jvmTarget = vs
                            }
                        }
                    }
                }
            } catch (Exception e) {}
        }
    }
    if (project.state.executed) {
        configureProject(project)
    } else {
        project.afterEvaluate { configureProject(it) }
    }
}
